name: Build and Deploy (FTP)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: LMS.API/LMS.API.csproj
  PUBLISH_DIR: publish

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" -c Release --no-build -o "$PUBLISH_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy over FTP
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lms-api
          path: ${{ env.PUBLISH_DIR }}

      - name: Install lftp
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp
          fi
          lftp --version | head -1

      - name: Resolve FTP settings
        id: ftp
        env:
          PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          PORT: ${{ vars.FTP_PORT }}
        run: |
          {
            echo "protocol=${PROTOCOL:-ftp}"
            echo "port=${PORT:-21}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Take the site offline (app_offline.htm)
        run: |
          cat > app_offline.htm <<'HTML'
          <!DOCTYPE html>
          <html><head><title>Maintenance</title></head>
          <body><h1>The site is being updated.</h1><p>Please try again in a minute.</p></body></html>
          HTML
          curl -sS --fail \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -T app_offline.htm \
            "${{ steps.ftp.outputs.protocol }}://${{ secrets.FTP_HOST }}/app_offline.htm"
          sleep 20

      - name: Clean mirror to the server
        env:
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ steps.ftp.outputs.port }}
        run: |
          lftp \
            --host="$FTP_PROTOCOL://$FTP_HOST" \
            --port="$FTP_PORT" \
            --user="$FTP_USER" \
            --password="$FTP_PASSWORD" \
            <<LFTP
          set net:timeout 60
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set xfer:clobber on
          set ftp:passive-mode on
          set ftp:ssl-allow auto

          mirror \
            --reverse \
            --delete \
            --verbose=3 \
            --parallel=4 \
            --exclude-regex '(^|/)appsettings[^/]*\.json' \
            --exclude-regex '(^|/)app_offline\.htm' \
            --exclude-regex '(^|/)\.well-known' \
            $PUBLISH_DIR/ /
          LFTP

      - name: Verify the deployment
        env:
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}
        run: |
          base="$FTP_PROTOCOL://$FTP_HOST/"
          listing=$(curl -sS --user "$FTP_LOGIN" --list-only "$base")
          missing=0
          for required in LMS.API.dll LMS.Application.dll LMS.Infrastructure.dll web.config wwwroot; do
            if echo "$listing" | grep -qw -- "$required"; then
              echo "OK   $required"
            else
              echo "MISS $required"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::Published output is incomplete on the server."; exit 1; }

      - name: Bring the site back online
        if: always()
        env:
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol || 'ftp' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}
        run: |
          base="$FTP_PROTOCOL://$FTP_HOST/"

          remove_marker() {
            if [ "$FTP_PROTOCOL" = "sftp" ]; then
              curl -sS --user "$FTP_LOGIN" --quote "rm app_offline.htm" "$base" >/dev/null 2>&1
            else
              curl -sS --user "$FTP_LOGIN" --quote "DELE app_offline.htm" "$base" >/dev/null 2>&1
              curl -sS --user "$FTP_LOGIN" --quote "DELE /app_offline.htm" "$base" >/dev/null 2>&1
            fi
          }

          marker_present() {
            curl -sS --user "$FTP_LOGIN" --list-only "$base" 2>/dev/null | grep -qi "app_offline.htm"
          }

          for attempt in 1 2 3; do
            remove_marker
            if marker_present; then
              echo "app_offline.htm is still there (attempt $attempt), retrying in 10s"
              sleep 10
            else
              echo "app_offline.htm removed - site is back online."
              exit 0
            fi
          done

          echo "::error::Could not delete app_offline.htm; the site stays offline until it is removed from the hosting file manager."
          exit 1

      - name: Health check
        if: ${{ vars.HEALTH_URL != '' }}
        run: |
          curl -sS --fail --retry 5 --retry-delay 10 --retry-all-errors "${{ vars.HEALTH_URL }}"
          echo "Site responded OK."
