name: Build and Deploy (FTP)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: LMS.API/LMS.API.csproj

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" -c Release --no-build -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-api
          path: publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy over FTP
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lms-api
          path: publish

      - name: Install lftp
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp
          fi
          lftp --version | head -1

      - name: Resolve FTP settings
        id: ftp
        env:
          PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          PORT: ${{ vars.FTP_PORT }}
        run: |
          {
            echo "protocol=${PROTOCOL:-ftp}"
            echo "port=${PORT:-21}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Take the site offline (app_offline.htm)
        run: |
          cat > app_offline.htm <<'HTML'
          <!DOCTYPE html>
          <html><head><title>Maintenance</title></head>
          <body><h1>The site is being updated.</h1><p>Please try again in a minute.</p></body></html>
          HTML
          # The IIS application root on this host is /wwwroot, so the marker only
          # releases the locked DLLs when it is written there; the Home copy is a
          # best-effort fallback for a second application at the site root.
          curl -sS --fail \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -T app_offline.htm \
            "${{ steps.ftp.outputs.protocol }}://${{ secrets.FTP_HOST }}/wwwroot/app_offline.htm"
          curl -sS \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -T app_offline.htm \
            "${{ steps.ftp.outputs.protocol }}://${{ secrets.FTP_HOST }}/app_offline.htm" || true
          sleep 30

      - name: Clean mirror to /wwwroot
        env:
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ steps.ftp.outputs.port }}
        run: |
          # Guard: an empty or missing publish folder would make lftp mirror the
          # runner's working directory instead of the build output.
          if [ ! -d publish ] || [ -z "$(ls -A publish)" ]; then
            echo "::error::The downloaded artifact folder 'publish' is missing or empty; refusing to mirror."
            exit 1
          fi

          lftp \
            -u "$FTP_USER,$FTP_PASSWORD" \
            -p "$FTP_PORT" \
            "$FTP_PROTOCOL://$FTP_HOST" \
            <<LFTP
          set net:timeout 60
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set xfer:clobber on
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set mirror:set-permissions off

          mirror \
            --reverse \
            --delete \
            --verbose=3 \
            --parallel=4 \
            -x '(^|/)appsettings[^/]*\.json' \
            -x '(^|/)app_offline\.htm' \
            -x '(^|/)\.well-known' \
            -x '(^|/)Logs(/|$)' \
            -x '(^|/)(wwwroot/)?(Images|Videos|Audios|Documents)(/|$)' \
            publish/ /wwwroot/
          quit
          LFTP

      - name: Ensure the live JWT signing key
        env:
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # The mirror skips appsettings*.json so the host keeps its own values, which
          # also means a key committed in the repo never reaches /wwwroot and the app
          # dies on startup with IDX10703 (zero-length SymmetricSecurityKey).
          # web.config pins ASPNETCORE_ENVIRONMENT=Test, so Test is the live file.
          file=appsettings.Test.json
          live_url="$FTP_PROTOCOL://$FTP_HOST/wwwroot/$file"
          login="$FTP_USER:$FTP_PASSWORD"
          curl -sS --fail --user "$login" -o live.json "$live_url" || true

          cat > ensure-jwt-key.cjs <<'NODE'
          const fs = require('fs');
          const read = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return null; } };

          const repoSecret = (process.env.JWT_SECRET || '').trim() ||
            (((read('publish/appsettings.Test.json') || {}).JwtSettings || {}).Secret || '').trim();

          if (!repoSecret) {
            console.error('::error::publish/appsettings.Test.json has no JwtSettings.Secret and JWT_SECRET is not set, so there is nothing to write to the live config.');
            process.exit(1);
          }

          const live = read('live.json');
          if (!live) {
            const config = read('publish/appsettings.Test.json') || {};
            config.JwtSettings = config.JwtSettings || {};
            config.JwtSettings.Secret = repoSecret;
            fs.writeFileSync('patched.json', JSON.stringify(config, null, 2) + '\n');
            console.log('upload-published');
          } else if (live.JwtSettings && live.JwtSettings.Secret) {
            console.log('skip');
          } else {
            live.JwtSettings = live.JwtSettings || {};
            live.JwtSettings.Secret = repoSecret;
            fs.writeFileSync('patched.json', JSON.stringify(live, null, 2) + '\n');
            console.log('patched');
          }
          NODE

          action=$(node ensure-jwt-key.cjs)

          case "$action" in
            skip) echo "Live config already has a signing key; leaving /wwwroot/$file untouched." ;;
            patched|upload-published)
              curl -sS --fail --user "$login" -T patched.json "$live_url"
              echo "/wwwroot/$file updated ($action)."
              ;;
            *)
              echo "::error::Unexpected result '$action' from ensure-jwt-key.cjs; the live config was not touched."
              exit 1
              ;;
          esac

          # Also ensure base appsettings.json exists on the live host
          if [ -f publish/appsettings.json ]; then
            base_url="$FTP_PROTOCOL://$FTP_HOST/wwwroot/appsettings.json"
            curl -sS --fail --user "$login" -o live_base.json "$base_url" || true
            if [ ! -s live_base.json ]; then
              curl -sS --fail --user "$login" -T publish/appsettings.json "$base_url" || true
              echo "/wwwroot/appsettings.json uploaded (initial)."
            fi
            rm -f live_base.json
          fi

      - name: Verify the deployment
        env:
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}
        run: |
          target="$FTP_PROTOCOL://$FTP_HOST/wwwroot/"
          if ! listing=$(curl -sS --fail --user "$FTP_LOGIN" --list-only "$target"); then
            echo "::error::Could not list $target to verify the deployment."
            exit 1
          fi
          missing=0
          for required in LMS.API.dll LMS.Application.dll LMS.Infrastructure.dll web.config; do
            if echo "$listing" | grep -qw -- "$required"; then
              echo "OK   $required"
            else
              echo "MISS $required"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::Published output is incomplete in /wwwroot."; exit 1; }

      - name: Bring the site back online
        if: always()
        env:
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol || 'ftp' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}
        run: |
          base="$FTP_PROTOCOL://$FTP_HOST/"

          remove_marker() {
            # Each attempt is allowed to fail: the marker may already be gone, and
            # the runner shell aborts on the first non-zero exit code otherwise.
            for marker in wwwroot/app_offline.htm app_offline.htm; do
              if [ "$FTP_PROTOCOL" = "sftp" ]; then
                curl -sS --user "$FTP_LOGIN" --quote "rm $marker" "$base" >/dev/null 2>&1 || true
              else
                curl -sS --user "$FTP_LOGIN" --quote "DELE $marker" "$base" >/dev/null 2>&1 || true
              fi
            done
          }

          marker_present() {
            curl -sS --user "$FTP_LOGIN" --list-only "${base}wwwroot/" 2>/dev/null | grep -qi "app_offline.htm" ||
            curl -sS --user "$FTP_LOGIN" --list-only "$base" 2>/dev/null | grep -qi "app_offline.htm"
          }

          for attempt in 1 2 3; do
            remove_marker
            if marker_present; then
              echo "app_offline.htm is still there (attempt $attempt), retrying in 10s"
              sleep 10
            else
              echo "app_offline.htm removed - site is back online."
              exit 0
            fi
          done

          echo "::error::Could not delete app_offline.htm; the site stays offline until it is removed from the hosting file manager."
          exit 1

      - name: Health check
        if: ${{ vars.HEALTH_URL != '' }}
        run: |
          curl -sS --fail --retry 5 --retry-delay 10 --retry-all-errors "${{ vars.HEALTH_URL }}"
          echo "Site responded OK."
