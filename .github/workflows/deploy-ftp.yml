name: Build and Deploy (FTP)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: LMS.API/LMS.API.csproj
  PUBLISH_DIR: publish

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" -c Release --no-build -o "$PUBLISH_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy over FTP
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lms-api
          path: ${{ env.PUBLISH_DIR }}

      - name: Resolve FTP settings
        id: ftp
        env:
          PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          PORT: ${{ vars.FTP_PORT }}
        run: |
          {
            echo "protocol=${PROTOCOL:-ftp}"
            echo "port=${PORT:-21}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Take the site offline (app_offline.htm)
        run: |
          cat > app_offline.htm <<'HTML'
          <!DOCTYPE html>
          <html><head><title>Maintenance</title></head>
          <body><h1>The site is being updated.</h1><p>Please try again in a minute.</p></body></html>
          HTML
          curl -sS --fail \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -T app_offline.htm \
            "${{ steps.ftp.outputs.protocol }}://${{ secrets.FTP_HOST }}/app_offline.htm"
          sleep 20

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.ftp.outputs.port }}
          protocol: ${{ steps.ftp.outputs.protocol }}
          local-dir: ${{ env.PUBLISH_DIR }}/
          server-dir: /
          timeout: 600
          exclude: |
            **/.git*/**
            **/appsettings*.json
            appsettings*.json
            **/Logs/**
            **/App_Data/**
            **/wwwroot/Images/**
            **/wwwroot/Videos/**
            **/wwwroot/Audios/**
            **/wwwroot/Documents/**

      - name: Bring the site back online
        if: always()
        run: |
          curl -sS \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            --quote "DELE app_offline.htm" \
            "${{ steps.ftp.outputs.protocol }}://${{ secrets.FTP_HOST }}/" || true

      - name: Health check
        if: ${{ vars.HEALTH_URL != '' }}
        run: |
          curl -sS --fail --retry 5 --retry-delay 10 --retry-all-errors "${{ vars.HEALTH_URL }}"
          echo "Site responded OK."
